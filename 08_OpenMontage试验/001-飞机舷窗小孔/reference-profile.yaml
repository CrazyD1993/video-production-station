aggregate_patterns:
  retain:
    - "第一秒出现大且可识别的视觉主体"
    - "前5秒完成对象、冲突、未知后果"
    - "尺度对比、行为演示和结构视角提供旁白之外的信息"
    - "字幕一屏一个短意群，关键词才强调"
    - "现实主体、微距、情境和解释画面混合"
  change:
    - "从5—8分钟横屏长视频重新设计为35—42秒9:16短视频"
    - "不复制极端恐吓和延迟解释"
    - "飞机舷窗结论必须绑定可验证来源"
  prohibited_copying:
    - original_visual_assets
    - original_script_or_narration
    - original_title
    - original_people_or_brand_assets
    - original_music_or_sound_design
    - highly_similar_shot_sequence

