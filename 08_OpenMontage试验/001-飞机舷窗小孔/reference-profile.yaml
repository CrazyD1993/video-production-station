  recommendation: retain_with_visual_conditions
  required_changes:
    - "KF1必须是真实感舷窗微距大主体。"
    - "KF2必须同时呈现真实材质、空间层次和可读压力路径。"
    - "KF3必须比较不同典型水汽/防雾设计，不模拟堵孔实验。"
    - "7镜头内部必须有足够的指针、水汽、压力路径或摄影机变化。"

