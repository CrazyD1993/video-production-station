content_formula:
  hook: "真实舷窗小孔大主体，立即否定瑕疵或漏气直觉"
  progression: "辨认小孔→看见非单层结构→理解客舱/夹层连通→压力由承压层承担"
  core_mechanism: pressure_equalization_to_load_bearing_pane
  reversal: "它不是瑕疵，而是典型舷窗压力设计的一部分"
  takeaway: "在典型设计中，小孔连通特定夹层与客舱侧，帮助主要压力按设计由承压层承担"
  structure_disclaimer: "典型结构示意，不对应具体机型"

